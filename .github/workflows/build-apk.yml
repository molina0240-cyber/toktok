name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Compilar APK de depuración
        run: |
          FILE=$(find . -name settings.gradle.kts -not -path './.git/*' | head -n 1)
          if [ -z "$FILE" ]; then
            echo "No se encontro settings.gradle.kts. Esto es lo que hay en el repositorio:"
            find . -maxdepth 3 -not -path './.git/*' | head -n 60
            exit 1
          fi
          DIR=$(dirname "$FILE")
          echo "Proyecto encontrado en: $DIR"
          cd "$DIR"
          gradle assembleDebug
          mkdir -p "$GITHUB_WORKSPACE/salida"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/salida/"

      - uses: actions/upload-artifact@v4
        with:
          name: VozTikTok-apk
          path: salida/app-debug.apk
